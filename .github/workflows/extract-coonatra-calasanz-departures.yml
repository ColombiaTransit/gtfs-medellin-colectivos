name: Extract Coonatra Calasanz exact departures
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/extract_coonatra_calasanz_original_departures.py'
      - '.github/workflows/extract-coonatra-calasanz-departures.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pymupdf
      - name: Extract and validate six original departure tables
        run: python scripts/extract_coonatra_calasanz_original_departures.py
      - name: Commit new operator timetables
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resolutions/coonatra_2022_calasanz_exact_departures_by_variant.csv
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish source-verifiable Calasanz variant-specific departure slots'
            git pull --rebase origin main
            git push
          fi
