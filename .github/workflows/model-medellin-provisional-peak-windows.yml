name: Model provisional Medellín PP PVM timetable windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/model_medellin_provisional_peak_windows.py'
      - '.github/workflows/model-medellin-provisional-peak-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build provisional daytype interval rows
        run: python scripts/model_medellin_provisional_peak_windows.py
      - name: Commit research-only interval model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/resolutions/2025_provisional_pp_pvm_operating_intervals.csv
          if ! git diff --cached --quiet; then
            git commit -m "research: publish provisional PP/PVM operating intervals"
            git push
          fi
