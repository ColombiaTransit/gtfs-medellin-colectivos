name: Validate historical 2015-to-ArcGIS route links

# Research-only manual verification. Never writes source data or GTFS.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate 2015 source linkage provenance and no-GTFS-import safeguards
        run: python scripts/validate_2015_arcgis_links.py
