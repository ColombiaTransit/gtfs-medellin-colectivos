name: Check 2026 ASTREA for later Palenque 2A acts

on:
  workflow_dispatch:
  push:
    branches:
      - research/palenque-2022-original-astrea-audit
    paths:
      - .github/workflows/scan-astrea-2026-palenque.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile scripts/scan_astrea_2026_palenque_acts.py
      - name: Scan official ASTREA 2026 acts, titles and relevant text
        run: python scripts/scan_astrea_2026_palenque_acts.py
      - name: Store seven-day metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrea-2026-palenque-legal-scan
          path: artifacts/medellin-astrea-2026-audit/
          retention-days: 7
          if-no-files-found: warn
