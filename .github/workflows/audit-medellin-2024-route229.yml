name: Audit 2024 official joint route 229 decision
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_medellin_2024_route229.py'
      - '.github/workflows/audit-medellin-2024-route229.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Read official operative articles and tables
        run: python scripts/audit_medellin_2024_route229.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medellin-2024-229-article-audit
          path: artifacts/medellin-2024-229/
          retention-days: 7
