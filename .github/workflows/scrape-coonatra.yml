name: Scrape Coonatra Routes + Frequency PDFs + KML

# One workflow: scrapes all 4 Coonatra route-group pages (branch names,
# schedule text, Google My Maps IDs), automatically finds and parses
# every frequency-timetable PDF linked from any of those pages, and
# fetches real KML geometry for every branch that scraped cleanly
# (scripts/fetch_coonatra_kml.py reads raw/coonatra_routes.json
# directly - currently Floresta-San Juan's 4 branches and
# Calasanz-Boston's 6; nothing is hardcoded, so if Copacabana or
# Circular Coonatra's reconciliation is fixed later, their branches get
# picked up automatically with no workflow changes needed). Purely a
# data-gathering step - does NOT build a GTFS feed yet. Manual trigger
# only, since the PDF column-mapping and the KML stop-point check both
# need a human to verify the printed diagnostic output before anything
# downstream trusts it.

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Coonatra route-group pages
        run: python scripts/scrape_coonatra.py

      - name: Parse every discovered frequency PDF
        run: |
          python3 -c "
          import json, subprocess, sys
          from pathlib import Path

          data = json.loads(Path('raw/coonatra_routes.json').read_text())
          pdf_urls = []
          for page in data:
              for url in page.get('frequency_pdf_urls', []):
                  if url not in pdf_urls:
                      pdf_urls.append(url)

          if not pdf_urls:
              print('No frequency PDF links found on any page.')
              sys.exit(0)

          print(f'Found {len(pdf_urls)} frequency PDF(s): {pdf_urls}')
          for url in pdf_urls:
              print(f'\n{\"=\"*70}\nParsing {url}\n{\"=\"*70}')
              subprocess.run(['python', 'scripts/parse_coonatra_pdf.py', url], check=True)
          "

      - name: Fetch KML for every cleanly-matched branch
        run: python scripts/fetch_coonatra_kml.py

      - name: Upload scraped data + PDFs + extracted tables + KML
        uses: actions/upload-artifact@v4
        with:
          name: coonatra-scrape
          path: |
            raw/coonatra_routes.json
            raw/coonatra_pdf_*.json
            raw/*.pdf
            raw/coonatra_kml/
            raw/coonatra_kml_summary.json
          retention-days: 30
          if-no-files-found: warn
