name: Audit all Medellín urbanas route schedule coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_medellin_frequency_coverage.py'
      - '.github/workflows/audit-medellin-frequency-coverage.yml'
permissions:
  contents: write
concurrency:
  group: medellin-frequency-coverage-main
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML reader
        run: pip install pyyaml
      - name: Compile source-first 252 route coverage
        run: python scripts/audit_medellin_frequency_coverage.py
      - name: Publish research registries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resolutions/medellin_252_route_schedule_coverage.csv data/resolutions/medellin_252_route_schedule_daytypes.csv data/resolutions/medellin_missing_frequency_windows_worklist.csv
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish frequency coverage and gaps for 252 Medellín ArcGIS routes'
            git pull --rebase origin main
            git push
          fi
