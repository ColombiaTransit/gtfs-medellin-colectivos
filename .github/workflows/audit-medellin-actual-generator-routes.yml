name: Audit published Medellín GTFS route IDs vs 252 urbanas
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_medellin_actual_generator_route_ids.py'
      - '.github/workflows/audit-medellin-actual-generator-routes.yml'
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing GTFS builders' dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python source
        run: python -m py_compile scripts/audit_medellin_actual_generator_route_ids.py
      - name: Compare actual released and archived GTFS
        run: python scripts/audit_medellin_actual_generator_route_ids.py
      - name: Keep audit CSV and summary in repository
        if: success()
        shell: bash
        run: |
          mkdir -p data/resolutions/generator_audit
          cp artifacts/medellin-generator-route-audit/inventory.json data/resolutions/generator_audit/inventory.json
          cp artifacts/medellin-generator-route-audit/README.md data/resolutions/generator_audit/README.md
          cp artifacts/medellin-generator-route-audit/actual_gtfs_routes.csv data/resolutions/generator_audit/actual_gtfs_routes.csv
          cp artifacts/medellin-generator-route-audit/ready_not_in_verified_gtfs.csv data/resolutions/generator_audit/ready_not_in_verified_gtfs.csv
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/resolutions/generator_audit/
          if ! git diff --staged --quiet; then
            git commit -m "Record exact generated GTFS route overlap with Medellín 252-route model"
            git push
          fi
      - name: Upload exact route and trip inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medellin-actual-gtfs-route-inventory
          path: artifacts/medellin-generator-route-audit/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if test -f artifacts/medellin-generator-route-audit/README.md; then
            cat artifacts/medellin-generator-route-audit/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
