name: Recover Gaceta 5671 official PDF
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/recover_medellin_gaceta_5671.py'
      - '.github/workflows/recover-medellin-gaceta-5671.yml'
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and HTML utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install requests beautifulsoup4
      - name: Download and verify public Gaceta 5671 original
        run: python scripts/recover_medellin_gaceta_5671.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medellin-official-gaceta-5671
          path: artifacts/medellin-original-gaceta-5671/
          retention-days: 7
