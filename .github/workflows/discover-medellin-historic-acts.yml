name: Discover historic Medellín ASTREA urban bus acts
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_medellin_historic_astrea_acts.py'
      - '.github/workflows/discover-medellin-historic-acts.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Verify original source candidates
        run: python scripts/discover_medellin_historic_astrea_acts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medellin-2017-2024-official-originals
          path: artifacts/medellin-2017-2024/
          if-no-files-found: warn
          retention-days: 7
