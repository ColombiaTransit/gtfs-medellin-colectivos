name: Build Sotrames GTFS-Flex

# One workflow, one run: fetches every Sotrames route's Google My Maps
# as KML, builds a GTFS-Flex feed from it (zone-level schedule data,
# flex pickup/drop-off zones instead of fixed stops - see
# scripts/build_gtfs_flex_sotrames.py's docstring for why), validates it
# with the real MobilityData validator, and uploads everything as one
# artifact. No manual download-and-commit step between fetch and build
# needed - both run in the same job, sharing raw/sotrames_kml/ on disk.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and inspect Sotrames route KML files
        run: python scripts/fetch_sotrames_kml.py

      - name: Build GTFS-Flex feed
        run: python scripts/build_gtfs_flex_sotrames.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve gtfs-validator-cli download URL
        id: resolve_validator
        run: |
          URL=$(curl -sSL https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if a['name'].endswith('-cli.jar')))")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Download gtfs-validator-cli.jar
        run: curl -L -o gtfs-validator-cli.jar "${{ steps.resolve_validator.outputs.url }}"

      - name: Validate
        run: |
          mkdir -p validation-report
          java -Xmx4G -jar gtfs-validator-cli.jar \
            -i gtfs-flex-sotrames.zip \
            -o validation-report

      - name: Upload KML data + feed + validation report
        uses: actions/upload-artifact@v4
        with:
          name: sotrames-gtfs-flex
          path: |
            raw/sotrames_kml/
            raw/sotrames_kml_summary.json
            gtfs-flex-sotrames.zip
            validation-report/report.html
            validation-report/report.json
          retention-days: 30
