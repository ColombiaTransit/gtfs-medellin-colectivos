name: Build El Poblado GTFS-Flex

# One workflow: fetches Autobuses El Poblado's route data (embedded
# directly in their homepage's HTML - no OCR/Maps export needed),
# builds a GTFS-Flex feed from it, validates with the real MobilityData
# validator, and uploads everything as one artifact.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape El Poblado route data
        run: python scripts/scrape_elpoblado.py

      - name: Build GTFS-Flex feed
        run: python scripts/build_gtfs_flex_elpoblado.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve gtfs-validator-cli download URL
        id: resolve_validator
        run: |
          URL=$(curl -sSL https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['browser_download_url'] for a in d['assets'] if a['name'].endswith('-cli.jar')))")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Download gtfs-validator-cli.jar
        run: curl -L -o gtfs-validator-cli.jar "${{ steps.resolve_validator.outputs.url }}"

      - name: Validate
        run: |
          mkdir -p validation-report
          java -Xmx4G -jar gtfs-validator-cli.jar \
            -i gtfs-flex-elpoblado.zip \
            -o validation-report

      - name: Upload route data + feed + validation report
        uses: actions/upload-artifact@v4
        with:
          name: elpoblado-gtfs-flex
          path: |
            raw/elpoblado_routes.json
            gtfs-flex-elpoblado.zip
            validation-report/report.html
            validation-report/report.json
          retention-days: 30
