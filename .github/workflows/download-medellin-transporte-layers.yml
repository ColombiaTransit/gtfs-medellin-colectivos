name: Download Medellín ArcGIS Transport Layers

# Bulk-downloads ALL data (every record, every field, no operator
# filter) from Medellín's official government ArcGIS public-transit
# layers - see scripts/download_medellin_transporte_layers.py for the
# full layer list and why this is split from operator-specific
# analysis - and COMMITS it to the repo under raw/medellin_raw/, so
# other workflows (e.g. query-medellin-transporte-trsc.yml) can read it
# straight from a checkout, no network access to medellin.gov.co
# required for analysis anymore. Manual trigger for now; this is a
# natural candidate for a monthly `schedule:` cron trigger once the
# data's real refresh rate is known (uncomment the schedule block below
# when ready) - government route/stop data presumably changes slowly,
# so a monthly cadence is a reasonable starting guess, not a confirmed
# fact.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of each month

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all layers
        run: python scripts/download_medellin_transporte_layers.py

      - name: Commit raw data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw/medellin_raw/
          # manifest.json's "downloaded_at" timestamp changes on every
          # run regardless of whether the underlying layer data
          # actually changed - excluded here so a commit (and the
          # resulting history) only happens when something real
          # changed, not on every single run.
          if git diff --staged --quiet -- ':!raw/medellin_raw/manifest.json'; then
            echo "No changes to the layer data itself (ignoring manifest.json's timestamp) - nothing to commit."
          else
            git commit -m "Refresh Medellín ArcGIS transport layer data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload raw data (quick access, in addition to the commit above)
        uses: actions/upload-artifact@v4
        with:
          name: medellin-transporte-raw
          path: raw/medellin_raw/
          retention-days: 90
          if-no-files-found: error
