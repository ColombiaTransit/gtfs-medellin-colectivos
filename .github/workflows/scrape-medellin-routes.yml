
name: Scrape Medellín Public Transport Routes

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Scrape Medellín route data
        run: |
          python scripts/scrape_medellin_routes.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          find data/medellin -type f -maxdepth 1 -print
          echo
          echo "Route count:"
          wc -l data/medellin/routes.csv
          echo
          echo "Administrative-act count:"
          wc -l data/medellin/route_admin_acts.csv

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/medellin/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update Medellín public transport routes"
            git push
          fi
