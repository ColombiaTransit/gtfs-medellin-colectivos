# Canonical source of truth for colectivo/alimentador schedules.
# This is the LIVE config scripts/build_gtfs.py reads (not a template -
# see data/operators.yml.example for the annotated version with the full
# investigation history behind these values).
#
# CURRENT STATE: all 46 confirmed routes (15 MDO / cuenca 3, 31 SAO6 /
# cuenca 6) are listed below with real names, but EVERY day_types is
# still empty - no schedule/headway data has been found for either
# operator yet. Running scripts/build_gtfs.py against this file today
# will build all 46 routes and shapes successfully, but zero trips (the
# validator will flag "route with no trips" for all of them) until
# day_types gets filled in for at least one route.
#
# The ArcGIS layers give us geometry and stops but NOT headways or
# operating hours. Operator websites give us headways but not
# machine-readable structured data.
#
# CONFIRMED operator/cuenca mapping (two independent site listings, each
# matching the same route codes seen in the ArcGIS 'ruta' field, and
# matching the full 46-route ArcGIS dump exactly):
#   cuenca 3 ("C3-xxx") -> MDO (Masivo de Occidente), masivodeoccidente.com
#   cuenca 6 ("C6-xxx") -> SAO6 (Sistema Alimentador Oriental), sao6.com.co
# Sotrames' zone (Itagüí/Envigado/Sabaneta) is confirmed NOT part of this
# ArcGIS layer at all - it's a separate program. Its scraped headway
# tables in raw/sotrames_scrape.json have nowhere to attach and should
# stay unattached until/unless its own route codes turn up somewhere.
#
# ONE unresolved naming mismatch: SAO6's site lists "C6-014A" and
# "C6-015"; ArcGIS instead has "C6-015A" and "C6-016A" - these don't
# overlap. Flagged inline below on the affected two routes with a
# tentative, UNVERIFIED guess at which name might belong to which code.
#
# Next real gap to close: schedule data for both operators. SAO6's own
# website is a confirmed dead end (checked their /rutas listing AND an
# individual route page - neither has headways). MDO's individual route
# pages haven't been checked yet.

operators:
  mdo:
    agency_name: "Masivo de Occidente"
    agency_url: "https://masivodeoccidente.com"
    zone: "Occidente - confirmed: operates all cuenca-3 'C3-xxx' routes"
  sao6:
    agency_name: "SAO6 - Sistema Alimentador Oriental"
    agency_url: "https://www.sao6.com.co"
    zone: "Oriente - confirmed: operates all cuenca-6 'C6-xxx' routes"
  sotrames:
    agency_name: "Sotrames S.A.S"
    agency_url: "https://www.sotrames.com.co"
    zone: "Itagüí / Envigado / Sabaneta - NOT part of this ArcGIS layer (confirmed)"

