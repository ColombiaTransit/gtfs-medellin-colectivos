# Tax Maya route mapping: official ArcGIS route identity (Medellín
# government transport layers, current) cross-referenced against real
# frequency/technical data from Gaceta Oficial N°4325 (Resolución 1042
# de 2015, "FICHA TÉCNICA" pages, PDF - older than the ArcGIS layers,
# so ArcGIS is used for GEOMETRY/STOPS, this PDF is used for
# FREQUENCY, per the project owner's explicit direction).
#
# CONFIDENCE LEVELS:
#   confirmed   - exact or near-exact name match between the PDF's
#                 "NOMBRE" field and the ArcGIS route's own nombre.
#   provisional - a reasonable match (e.g. "Pedregal Alto" in the PDF
#                 vs "Pedregal Bajo" in ArcGIS - same vereda corridor,
#                 no other candidate exists in either source, but the
#                 naming discrepancy is real and unexplained) or a
#                 structural inference (the PDF's single "C23-i" entry
#                 mapped to BOTH of ArcGIS's Izquierda/Derecha variants,
#                 the same left/right branch pattern already seen for
#                 Coonatra's V3 Boquerón).
#
# ALL FREQUENCY NUMBERS BELOW ARE FROM THE PDF, taken at face value.
# The PDF's "INTERVALO DE DESPACHO" table has two columns per day-type
# ("DÍA" and "HMD") - HMD very likely means "Hora de Máxima Demanda"
# (peak-hour headway), but the PDF does NOT state clock-time boundaries
# for when peak hours apply, so only the "DÍA" (general/normal) headway
# is used to build frequencies.txt below - using HMD would require
# guessing peak-hour clock windows that aren't in the source, which
# this project's established practice avoids. The real HMD values are
# kept here for reference/future use, not discarded, just not built
# into the GTFS frequencies yet.
#
# DAY-TYPE NOTE: the PDF gives 4 day-types (Día Normal, Sábado, Domingo,
# Festivo) - Domingo and Festivo have IDENTICAL values in every route
# observed. GTFS calendar.txt can express weekday/Saturday/Sunday as a
# real weekly pattern, but "Festivo" (holidays) needs calendar_dates.txt
# with actual Colombian holiday dates, which isn't available here -
# Festivo is deliberately NOT built as a separate service, since its
# real values already match Sunday's exactly in every case seen.

routes:
  - id_ruta: "90328"
    codigo_arcgis: "C23i IZQUIERA"
    codigo_pdf: "C23-i"
    nombre: "San Cristóbal-Estación San Javier (Izquierda)"
    identity_confidence: provisional  # PDF's single "C23-i" entry split
      # across ArcGIS's Izquierda/Derecha pair - same branch pattern
      # already confirmed for Coonatra's V3 Boquerón
    tipo: "Integrada"
    empresa: "Tax Maya"
    longitud_km: 19.48
    horario_inicio: "03:35:00"
    horario_fin: "23:00:00"
    headway_min:
