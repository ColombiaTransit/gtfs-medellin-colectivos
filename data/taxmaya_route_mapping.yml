#   - id_ruta 90326 "C23_Alterna" (San Cristóbal-La Asomadera-Centro)
#     and 90327 "C23" (San Cristóbal-San Javier-La Loma-Centro): these
#     are the website's "Rutas urbanas" category (plain C23 / C23
#     alterna asomadera), distinct from the "Rutas integradas"
#     (C23i/C23ii) family the Gaceta documented under Resolución 1042
#     de 2015. Plausibly these didn't exist in their current form yet
#     in 2015, or existed under a different code this resolution
#     didn't capture - not confirmed either way, but a more likely
#     explanation than a missed page in a 336-page document.
#   - "C23 AL 7" (Alimentadora La Palma, Gaceta-confirmed real data:
#     BUS vehicle 27-31 cap, 17.20km, 3:25-23:00, headway 9/8/16 min)
#     has NO confirmed ArcGIS id_ruta match. Plausibly discontinued or
#     restructured out of existence by the time of the current ArcGIS
#     snapshot - a real, named, government-registered route in 2015
#     that may simply no longer run today, rather than one tracked
#     elsewhere (the MDO/SAO6 explanation considered earlier is a
#     weaker fit here, since those never appeared in ANY Gaceta-style
#     resolution the way this route did).
