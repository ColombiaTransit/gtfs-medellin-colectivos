# Tax Maya route mapping: official ArcGIS route identity (Medellín
# government transport layers, current) cross-referenced against real
# frequency/technical data. Two sources, per route:
#   - Gaceta Oficial N°4325 (Resolución 1042 de 2015, "FICHA TÉCNICA"
#     pages) - covers the whole C23 family plus 195/195i/195ii, but is
#     11 years older than the ArcGIS layers, so ArcGIS is used for
#     GEOMETRY/STOPS regardless of which schedule source a route uses.
#   - Real schedule-board photos shared directly (2026) - only exist
#     for 195 and 195i, and are used in preference to the Gaceta for
#     those two specifically, since they are current and give real
#     per-day-type hours (not just headway) - see "source" per route.
#
# SCHEDULE SCHEMA: each route has a `schedule` dict with one entry per
# real day-type (dia_normal/sabado/domingo), each giving its own
# horario_inicio/horario_fin and headway_min - this matters because,
# per the real screenshot data for 195/195i, weekday and Saturday
# don't necessarily share the same service span (e.g. 195's weekday
# start is 5:15 vs Saturday's 5:35). The Gaceta-sourced C23 and 195ii
# routes repeat the same horario across all 3 day-types, since that's
# genuinely what the Gaceta itself gives (one service span per route,
# only headway varies by day-type).
#
# CONFIDENCE LEVELS:
#   confirmed   - exact or near-exact name match between the source's
#                 route-name field and the ArcGIS route's own nombre.
#   provisional - a reasonable match (e.g. "Pedregal Alto" in the
#                 Gaceta vs "Pedregal Bajo" in ArcGIS - same vereda
#                 corridor, no other candidate exists in either
#                 source, but the naming discrepancy is real and
#                 unexplained) or a structural inference (the Gaceta's
#                 single "C23-i" entry mapped to BOTH of ArcGIS's
#                 Izquierda/Derecha variants, the same left/right
#                 branch pattern already seen for Coonatra's V3
#                 Boquerón).
#
# GACETA HEADWAY NOTE: the Gaceta's "INTERVALO DE DESPACHO" table has
# two columns per day-type ("DÍA" and "HMD") - HMD very likely means
# "Hora de Máxima Demanda" (peak-hour headway), but the Gaceta does NOT
# state clock-time boundaries for when peak hours apply, so only the
# "DÍA" (general/normal) headway is used below for Gaceta-sourced
# routes - using HMD would require guessing peak-hour clock windows
# that aren't in the source. For the SAME reason, the real screenshot
# data's "hora pico" (peak) figures for 195/195i are also not used
# below - only "hora valle" (off-peak), since the screenshots likewise
# never state when peak hours start or end.
#
# DAY-TYPE NOTE: the Gaceta gives 4 day-types (Día Normal, Sábado,
# Domingo, Festivo) - Domingo and Festivo have IDENTICAL values in
# every route observed. GTFS calendar.txt can express weekday/
# Saturday/Sunday as a real weekly pattern, but "Festivo" (holidays)
# needs calendar_dates.txt with actual Colombian holiday dates, which
# isn't available here - Festivo is deliberately NOT built as a
# separate service, since its real values already match Sunday's
# exactly in every Gaceta-sourced route observed.

routes:
  # --- 195 family: real ArcGIS geometry, 195/195i use real current
  # schedule-board photos (richer than the Gaceta - real per-day-type
  # hours, not just headway); 195ii has no other source, uses the
  # Gaceta.
  - id_ruta: "90288"
    codigo_arcgis: "195"
    nombre: "Simón Bolívar-Unicentro-Centro"
    identity_confidence: confirmed
    empresa: "Tax Maya"
    source: "real schedule-board photo, shared directly (2026)"
    schedule:
      dia_normal:
        horario_inicio: "05:15:00"
        horario_fin: "20:36:00"
        headway_min: 5  # "hora valle" - peak (3-4 min) not used, see module docstring
      sabado:
        horario_inicio: "05:35:00"
        horario_fin: "19:40:00"
        headway_min: 6
      domingo:
        horario_inicio: "07:12:00"
        horario_fin: "18:00:00"
        headway_min: 12

  - id_ruta: "90289"
