# Transportes Rapido San Cristobal (TRSC) - route identity mapping.
#
# The 21 real routes below (each id_ruta = one real route, each with
# TWO directional records - Origen-Destino / Destino-Origen - in the
# official Rutas layer) come from Medellín's official government
# ArcGIS data (mapas_nacionales/VC_Transporte/MapServer/5 and 6),
# cross-referenced against trscsas.com's own /rutas/ page (25 website
# entries: some map 1:1 to a real route, several are itinerary-detail
# variants of one real route, and a few real routes aren't listed on
# the website at all) and its /horarios/ page (11 schedule photos,
# only ONE of which has a real caption on the page itself - the rest
# were matched by name/content, several genuinely ambiguously).
#
# CONFIDENCE LEVELS, used throughout below:
#   confirmed   - direct evidence: an exact name match, a real page
#                 caption, or the person running this project visually
#                 comparing the actual maps.
#   provisional - a reasonable working assumption (shared schedule
#                 across same-named route variants, geographic
#                 plausibility, or "this is probably the same family")
#                 that was NOT independently verified. Safe to use for
#                 a first GTFS build, but should carry a provisional
#                 flag all the way through (same pattern as SAO6's
#                 placeholder schedule data elsewhere in this project) -
#                 not presented as equivalent to confirmed data.
#
# UNRESOLVED TENSION, flagged here rather than silently picked: the
# original "share one schedule across all four 255i/255iD Aurora
# branches (Carcel, Pajarito, Regina, Roblemar)" idea, made before any
# official route-ID evidence existed, has since been PARTIALLY
# superseded by stronger, route-specific evidence for two of those four
# (Carcel via a real page caption, Pajarito via geographic
# plausibility). The other two website itinerary names -
# "Itinerario 255iD Metrocable La Aurora - Regina" and
# "... - Roblemar" - were never matched to a specific id_ruta at all
# and have no confirmed home in this file. Their schedule photos
# (REGINA column, and the separate Doña-Maria-family 255 ROBLEMAR
# photo, which is NOT the same Roblemar) are recorded in
# data/trsc_schedule_photos.json but are not attached to any route here.

